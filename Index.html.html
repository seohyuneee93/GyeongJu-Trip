<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경주 여행 일정표</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="8월 8일-9일 경주 여행 일정표">
<style>
  /* ==========================================================
     Tokens transcribed from the Microsoft Teams UI Kit — Design
     System project (tokens/colors.css, typography.css, radius.css,
     elevation.css, spacing.css). Light-theme values are verbatim
     from that file. Dark-theme values beyond its 3 given spot
     colors (surface-card/canvas, fg-default) are a same-ramp
     extension, since the source file doesn't fully specify dark.
     Structure/tokens carried over verbatim from the 제주 여행
     일정표 앱 (same layout, different trip content).
     ========================================================== */
  :root{
    --brand-primary-rgb: 91 95 199;      /* #5B5FC7 */
    --brand-primary-hover: rgb(70,73,159);
    --brand-primary-pressed: rgb(54,56,123);
    --brand-tint: rgb(232,235,250);
    --brand-border: rgb(146,153,247);

    --fg-default: rgb(36,36,36);
    --fg-secondary: rgb(66,66,66);
    --fg-tertiary: rgb(97,97,97);
    --fg-on-brand: rgb(255,255,255);

    --surface-canvas: rgb(255,255,255);
    --surface-card: rgb(245,245,245);
    --surface-sunken: rgb(250,250,250);

    --border-default: rgb(225,223,221);
    --border-subtle: rgb(237,235,233);
    --border-strong: rgb(205,205,205);

    --status-info-rgb: 0 120 212;       /* train */
    --status-success-rgb: 107 183 0;    /* (unused here) */
    --status-warning-rgb: 240 102 17;   /* food */
    --status-urgent-rgb: 233 89 217;    /* (unused here) */
    --status-danger-rgb: 197 15 31;     /* pending/undecided */
    --leisure-rgb: 138 102 0;           /* free time */
    --tint-alpha: 0.1;

    --radius-small: 2px;
    --radius-medium: 4px;
    --radius-large: 8px;
    --radius-pill: 9999px;

    --shadow-4: 0px 0px 2px rgba(0,0,0,0.12), 0px 2px 4px rgba(0,0,0,0.14);

    --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;

    --font-family-base: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-family-mono: Menlo, Consolas, "SF Mono", monospace;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface-canvas: rgb(31,31,31);
      --surface-card: rgb(37,36,36);
      --surface-sunken: rgb(24,24,24);
      --fg-default: rgb(245,245,245);
      --fg-secondary: rgb(214,214,214);
      --fg-tertiary: rgb(166,166,166);
      --border-default: rgb(61,59,57);
      --border-subtle: rgb(47,45,43);
      --border-strong: rgb(96,94,92);
      --brand-tint: rgba(91,95,199,0.28);
      --tint-alpha: 0.18;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --surface-canvas: rgb(31,31,31);
    --surface-card: rgb(37,36,36);
    --surface-sunken: rgb(24,24,24);
    --fg-default: rgb(245,245,245);
    --fg-secondary: rgb(214,214,214);
    --fg-tertiary: rgb(166,166,166);
    --border-default: rgb(61,59,57);
    --border-subtle: rgb(47,45,43);
    --border-strong: rgb(96,94,92);
    --brand-tint: rgba(91,95,199,0.28);
    --tint-alpha: 0.18;
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; height:100%; overflow-x:hidden;
    background: var(--surface-sunken);
  }
  body{
    font-family: var(--font-family-base);
    color: var(--fg-default);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button{ font-family: inherit; }

  .shell{
    display:flex; flex-direction:column;
    height: 100vh; height: 100dvh;
    max-width: 520px; margin: 0 auto;
    background: var(--surface-sunken);
    overflow: hidden;
  }

  /* ---- header ---- */
  .header{
    flex: 0 0 auto;
    background: linear-gradient(135deg, rgb(var(--brand-primary-rgb)), var(--brand-primary-pressed));
    color: var(--fg-on-brand);
    padding: calc(env(safe-area-inset-top, 0px) + var(--space-5)) var(--space-5) var(--space-4);
  }
  .header .title{ font-size: 22px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .header .sub{ font-size: 14px; opacity: 0.9; margin-top: var(--space-1); }

  /* ---- tab bar ---- */
  .tabbar{
    flex: 0 0 auto;
    display: flex;
    background: var(--surface-canvas);
    border-bottom: 1px solid var(--border-default);
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .tabbar::-webkit-scrollbar{ display:none; }
  .tab{
    flex: 1 1 0; min-width: 0; min-height: 44px;
    background: none; border: none; cursor: pointer;
    padding: var(--space-3) var(--space-1);
    border-bottom: 2px solid transparent;
    font-size: 14px; font-weight: 700; color: var(--fg-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab[aria-selected="true"]{
    color: rgb(var(--brand-primary-rgb));
    border-bottom-color: rgb(var(--brand-primary-rgb));
  }
  .tab:focus-visible{ outline: 2px solid rgb(var(--brand-primary-rgb)); outline-offset: -2px; }

  /* ---- content ---- */
  .content{
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-top: var(--space-5);
    padding-left: var(--space-5);
    padding-right: var(--space-5);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--space-8));
  }
  .footer{
    flex: 0 0 auto; text-align:center; font-size:12px; color: var(--fg-tertiary);
    border-top: 1px solid var(--border-subtle); background: var(--surface-canvas);
    padding: var(--space-2) var(--space-4) calc(env(safe-area-inset-bottom, 0px) + var(--space-2));
  }
  .screen{ animation: enter .22s ease; }
  @keyframes enter{ from{ opacity:0; transform: translateY(4px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  /* ---- home screen ---- */
  .section + .section{ margin-top: var(--space-6); }
  .section-label{
    display:flex; align-items:center; gap: 10px;
    margin-bottom: var(--space-3);
  }
  .badge{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .section-label .text{
    font-size: 16px; font-weight:700; color: var(--fg-default);
    letter-spacing: -0.01em;
  }
  .card{
    background: var(--surface-canvas); border:1px solid var(--border-default);
    border-radius: var(--radius-large); padding: var(--space-4);
    box-shadow: var(--shadow-4);
  }
  .divider{ height:1px; background: var(--border-subtle); }
  .item-head{ display:flex; align-items:baseline; gap: var(--space-2); margin-bottom: 10px; }
  .item-direction{ font-size:14px; font-weight:700; }
  .item-date{ font-size: 14px; color: var(--fg-default); }

  .leg{ display:flex; flex-direction:column; }
  .leg .row{ display:flex; align-items:center; gap: var(--space-3); }
  .leg .stop{ text-align:center; min-width:44px; }
  .leg .time{ font-size:16px; font-weight:700; color: var(--fg-default); font-variant-numeric: tabular-nums; }
  .city{ font-size:16px; font-weight:700; color: var(--fg-default); margin-top:2px; }
  .pending{ color: rgb(var(--status-danger-rgb)); }
  .leg .path{ flex:1; display:flex; flex-direction:column; align-items:center; gap: var(--space-1); min-width:0; }
  .leg .line-row{ width:100%; display:flex; align-items:center; gap: var(--space-2); }
  .leg .line{ flex:1; height:1px; background: var(--border-default); }
  .leg .flightno{ font-size: 14px; color: var(--fg-default); white-space:nowrap; }

  .stack{ display:flex; flex-direction:column; gap: var(--space-3); }

  /* ---- day timeline ---- */
  .timeline-item{ position:relative; }
  .timeline-item.has-connector{ padding-bottom: var(--space-6); }
  .ti-top{ display:flex; align-items:center; gap: 10px; }
  .rail{ width:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; }
  .icon-dot{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 3px var(--surface-canvas);
  }
  .rail-line{ position:absolute; left:13px; width:2px; background: var(--border-default); }
  .rail-line.stem{ top:28px; bottom:0; }
  .rail-line.full{ top:0; bottom:0; }
  .ti-rest{ padding-left: calc(28px + var(--space-2)); }
  .t-row{ display:flex; align-items:baseline; justify-content:space-between; gap: var(--space-2); flex:1; min-width:0; }
  .t-time{ font-size:16px; font-weight:700; font-variant-numeric: tabular-nums; flex-shrink:0; color: var(--fg-default); }
  .t-time.tbd{ font-style:italic; color: var(--fg-tertiary); }
  .t-title{ font-size:16px; font-weight:600; color:var(--fg-default); min-width:0; }
  .t-place{ font-size:14px; color: var(--fg-tertiary); margin-top:2px; }
  .t-note{
    margin-top: var(--space-2); font-size:14px; color: var(--fg-secondary);
    background: var(--surface-card); border-radius: var(--radius-small); padding: var(--space-1) var(--space-2); width:fit-content;
  }
  .trailing-note{
    margin-top: var(--space-6); margin-left:40px;
    border:1px dashed var(--border-strong); border-radius: var(--radius-large);
    padding: var(--space-3) var(--space-4); font-size:14px; color: var(--fg-tertiary);
  }

  /* ---- expense tab ---- */
  .exp-row{ display:flex; align-items:center; justify-content:space-between; gap: var(--space-3); cursor:pointer; }
  .exp-row-main{ display:flex; align-items:center; gap:10px; min-width:0; }
  .exp-cat-icon{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .exp-name{ font-size:14px; font-weight:600; color: var(--fg-default); }
  .exp-day{ font-size:14px; color: var(--fg-tertiary); margin-top:1px; }
  .exp-amount{
    font-size:14px; font-weight:700; color: var(--fg-default);
    font-variant-numeric: tabular-nums; white-space:nowrap; flex-shrink:0;
  }
  .add-btn{
    width:28px; height:28px; padding:0; border-radius:50%; flex-shrink:0; border:none; cursor:pointer;
    background: var(--brand-tint); color: rgb(var(--brand-primary-rgb));
    display:flex; align-items:center; justify-content:center;
  }

  /* ---- add-expense modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.4);
    display:none; align-items:center; justify-content:center; z-index:100; padding: var(--space-5);
  }
  .modal-backdrop.open{ display:flex; }
  .modal-panel{
    background: var(--surface-canvas); border-radius: var(--radius-large);
    padding: var(--space-5); width:100%; max-width:340px; box-shadow: var(--shadow-4);
  }
  .modal-title{ font-size:16px; font-weight:700; color: var(--fg-default); margin-bottom: var(--space-4); }
  .cat-picker{ display:flex; gap: var(--space-2); margin-bottom: var(--space-4); flex-wrap:wrap; }
  .cat-btn{
    width:40px; height:40px; border-radius:50%; border:2px solid transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .cat-btn.active{ border-color: currentColor; }
  .field{ margin-bottom: var(--space-4); }
  .field label{ display:block; font-size:14px; color: var(--fg-tertiary); margin-bottom: var(--space-1); }
  .field input{
    width:100%; box-sizing:border-box; border:1px solid var(--border-input); border-radius: var(--radius-medium);
    padding: var(--space-2) var(--space-3); font-size:14px; color: var(--fg-default);
    background: var(--surface-canvas); font-family: inherit;
  }
  .field input:focus{ outline:2px solid rgb(var(--brand-primary-rgb)); outline-offset:-1px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap: var(--space-2); }
  .btn-primary, .btn-secondary, .btn-danger{
    border:none; border-radius: var(--radius-medium); padding: var(--space-2) var(--space-4);
    font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .btn-primary{ background: rgb(var(--brand-primary-rgb)); color:#fff; }
  .btn-secondary{ background: var(--surface-card); color: var(--fg-secondary); }
  .btn-danger{ background: var(--surface-card); color: rgb(var(--status-danger-rgb)); }

  /* icon-svg intentionally has no width/height rule here — the inline
     width/height attributes set per call in icon(name,size) control size;
     a CSS rule would win over those attributes and silently override them. */
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div class="title">경주 여행</div>
    <div class="sub">8월 8일(토) - 8월 9일(일)</div>
  </div>

  <div class="tabbar" id="tabbar" role="tablist" aria-label="일정 탭"></div>

  <div class="content" id="content"></div>

  <div class="footer">made by Seohyun</div>
</div>

<div class="modal-backdrop" id="expenseModalBackdrop">
  <div class="modal-panel">
    <div class="modal-title" id="modalTitle">지출 추가</div>
    <div class="cat-picker" id="catPicker"></div>
    <div class="field">
      <label for="expTitleInput">항목명</label>
      <input type="text" id="expTitleInput" placeholder="예: 저녁 식사">
    </div>
    <div class="field">
      <label for="expAmountInput">금액</label>
      <input type="text" id="expAmountInput" placeholder="0" inputmode="numeric" pattern="[0-9,]*">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-danger" id="expDeleteBtn" style="display:none">삭제</button>
      <div style="flex:1"></div>
      <button type="button" class="btn-secondary" id="expCancelBtn">취소</button>
      <button type="button" class="btn-primary" id="expAddBtn">추가</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="budgetModalBackdrop">
  <div class="modal-panel">
    <div class="modal-title">예산 변경</div>
    <div class="exp-day" id="currentBudgetLabel" style="margin-bottom:var(--space-4)"></div>
    <div class="field">
      <label for="budgetInput">새 예산</label>
      <input type="text" id="budgetInput" placeholder="0" inputmode="numeric" pattern="[0-9,]*">
    </div>
    <div class="modal-actions">
      <div style="flex:1"></div>
      <button type="button" class="btn-secondary" id="budgetCancelBtn">취소</button>
      <button type="button" class="btn-primary" id="budgetSaveBtn">저장</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* 공용 지출/예산 데이터 저장소. anon public key는 공개돼도 안전하도록
   설계된 키이며, RLS를 꺼둔 상태라 이 페이지 URL을 아는 사람 누구나
   읽고 쓸 수 있음 — 부부 둘이서만 링크를 아는 용도로는 문제없음. */
const SUPABASE_URL = 'https://qxtbkngxixemxlljfece.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NBSVExpCpOuY09BTC1TZBQ_YAytw1qd';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ICON_VIEWBOX = { train: '0 0 24 24', hotel: '0 0 24 24', food: '0 0 24 24', coffee: '0 0 24 24', wallet: '0 0 24 24', ticket: '0 0 24 24', plus: '0 0 24 24' };

const ICONS = {
  train: '<path d="M12,2c-4,0 -8,0.5 -8,4v9.5C4,17.43 5.57,19 7.5,19L6,20.5V21h1.23l1.5,-1.5h6.54l1.5,1.5H18v-0.5L16.5,19c1.93,0 3.5,-1.57 3.5,-3.5V6c0,-3.5 -4,-4 -8,-4zM7.5,17c-0.83,0 -1.5,-0.67 -1.5,-1.5S6.67,14 7.5,14s1.5,0.67 1.5,1.5S8.33,17 7.5,17zM11,10H6V6h5v4zM13,10V6h5v4h-5zM16.5,17c-0.83,0 -1.5,-0.67 -1.5,-1.5s0.67,-1.5 1.5,-1.5 1.5,0.67 1.5,1.5S17.33,17 16.5,17z" fill="currentColor"/>',
  hotel: '<path d="M7,13c1.66,0 3,-1.34 3,-3S8.66,7 7,7s-3,1.34 -3,3S5.34,13 7,13zM19,7h-8v7H3V5H1v15h2v-3h18v3h2v-9c0,-2.21 -1.79,-4 -4,-4z" fill="currentColor"/>',
  wallet: '<path d="M21,7h-1V6c0,-1.66 -1.34,-3 -3,-3H4C2.34,3 1,4.34 1,6v12c0,1.66 1.34,3 3,3h14c1.66,0 3,-1.34 3,-3v-1h1c0.55,0 1,-0.45 1,-1v-6C22,7.45 21.55,7 21,7zM4,5h13c0.55,0 1,0.45 1,1v1H4c-0.55,0 -1,-0.45 -1,-1S3.45,5 4,5zM20,17c0,0.55 -0.45,1 -1,1H4c-0.55,0 -1,-0.45 -1,-1V8.83C3.31,8.94 3.65,9 4,9h16v2h-3c-1.1,0 -2,0.9 -2,2s0.9,2 2,2h3V17zM20,13h-3v-2h3V13z" fill="currentColor"/>',
  food: '<path d="M11,9H9V2H7v7H5V2H3v7c0,2.12 1.66,3.84 3.75,3.97V22h2.5v-9.03C11.34,12.84 13,11.12 13,9V2h-2V9zM16,6v8h2.5v8H21V2C18.24,2 16,4.24 16,6z" fill="currentColor"/>',
  coffee: '<path d="M2,21h18v-2H2V21zM20,8h-2V5h2V3H4v9c0,2.21 1.79,4 4,4h6c2.21,0 4,-1.79 4,-4v-1h2c1.11,0 2,-0.89 2,-2V10C22,8.89 21.11,8 20,8zM20,10h-2V9h2V10z" fill="currentColor"/>',
  ticket: '<path d="M20,12V8c0,-1.1 -0.9,-2 -2,-2H6C4.9,6 4,6.9 4,8v4c1.1,0 2,0.9 2,2s-0.9,2 -2,2v4c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2v-4c-1.1,0 -2,-0.9 -2,-2S18.9,12 20,12zM13,17.5h-2v-1.5h2V17.5zM13,14.5h-2v-1.5h2V14.5zM13,11.5h-2v-1.5h2V11.5z" fill="currentColor"/>',
  plus: '<path d="M19,13H13v6h-2v-6H5v-2h6V5h2v6h6V13z" fill="currentColor"/>',
};

function icon(name, size){
  const vb = ICON_VIEWBOX[name] || '0 0 20 20';
  return '<svg class="icon-svg" width="'+size+'" height="'+size+'" viewBox="'+vb+'" fill="none">'+ICONS[name]+'</svg>';
}

/* Category → Teams status-color mapping. "train" takes the same info-blue
   slot the 제주 앱 used for flight (main transport category). */
const CAT = {
  train:  { rgbVar: '--status-info-rgb',    icon: 'train', isBrand: false },
  hotel:  { rgbVar: '--brand-primary-rgb',  icon: 'hotel', isBrand: true },
  food:   { rgbVar: '--status-warning-rgb', icon: 'food',  isBrand: false },
  leisure:{ rgbVar: '--leisure-rgb',        icon: 'coffee', isBrand: false },
  total:  { rgbVar: '--brand-primary-rgb',  icon: 'wallet', isBrand: true },
  ticket: { rgbVar: '--status-urgent-rgb',  icon: 'ticket', isBrand: false },
};
function catColor(cat){ return 'rgb(var(' + CAT[cat].rgbVar + ') / 1)'; }
function catTint(cat){
  return CAT[cat].isBrand
    ? 'var(--brand-tint)'
    : 'rgb(var(' + CAT[cat].rgbVar + ') / var(--tint-alpha))';
}

function timelineItem({ cat, time, tbd, title, place, note, last, noIcon }){
  const c = CAT[cat];
  const restHtml = (
    '<div class="ti-rest">'
      + (place
          ? '<div class="t-place">- '+(place === '미정' ? '<span class="pending">미정</span>' : place)+'</div>'
          : '<div class="t-place" style="visibility:hidden">-</div>')
      + (note ? '<div class="t-note">'+note+'</div>' : '')
    + '</div>'
  );
  return (
    '<div class="timeline-item'+(last ? '' : ' has-connector')+'">'
      + (noIcon ? '<div class="rail-line full"></div>' : (last ? '' : '<div class="rail-line stem"></div>'))
      + '<div class="ti-top">'
        + '<div class="rail">'
          + (noIcon ? '' : '<div class="icon-dot" style="background:'+catTint(cat)+';color:'+catColor(cat)+'">'+icon(c.icon,18)+'</div>')
        + '</div>'
        + '<div class="t-row">'
          + '<div class="t-title">'+title+'</div>'
          + '<div class="t-time'+(tbd ? ' tbd' : '')+'">'+time+'</div>'
        + '</div>'
      + '</div>'
      + restHtml
    + '</div>'
  );
}

function itemHead(cat, direction, date){
  return '<div class="item-head"><span class="item-direction" style="color:'+catColor(cat)+'">'+direction+'</span><span class="item-date">'+date+'</span></div>';
}

function sectionLabel(cat, label){
  const c = CAT[cat];
  return (
    '<div class="section-label">'
      + '<div class="badge" style="background:'+catTint(cat)+';color:'+catColor(cat)+'">'+icon(c.icon,18)+'</div>'
      + '<div class="text">'+label+'</div>'
    + '</div>'
  );
}

function renderHome(){
  return (
    '<div class="screen">'
    + '<div class="section">'
      + sectionLabel('train','기차')
      + '<div class="card"><div class="stack">'
        + '<div class="leg">'
          + itemHead('train','가는 편','8월 8일(토)')
          + '<div class="row">'
            + '<div class="stop"><div class="time">06:30</div><div class="city">수서</div></div>'
            + '<div class="path"><div class="line-row"><div class="line"></div>'+icon('train',18)+'<div class="line"></div></div><div class="flightno">SRT 305</div></div>'
            + '<div class="stop"><div class="time">08:31</div><div class="city">경주</div></div>'
          + '</div>'
        + '</div>'
        + '<div class="divider"></div>'
        + '<div class="leg">'
          + itemHead('train','오는 편','8월 9일(일)')
          + '<div class="row">'
            + '<div class="stop"><div class="time">17:24</div><div class="city">경주</div></div>'
            + '<div class="path"><div class="line-row"><div class="line"></div>'+icon('train',18)+'<div class="line"></div></div><div class="flightno">KTX 048</div></div>'
            + '<div class="stop"><div class="time">19:34</div><div class="city">서울</div></div>'
          + '</div>'
        + '</div>'
      + '</div></div>'
    + '</div>'
    + '<div class="section">'
      + sectionLabel('hotel','숙소')
      + '<div class="card">'
        + itemHead('hotel','Day 1~2','8월 8일(토) ~ 8월 9일(일)')
        + '<div class="city">라한셀렉트 경주</div>'
      + '</div>'
    + '</div>'
    + '</div>'
  );
}

const DAY_TIMELINES = [
  null, // index 0 = home
  { items: [
      { cat:'train', time:'06:30', title:'수서 출발', place:'SRT 305' },
      { cat:'train', time:'08:31', title:'경주 도착' },
      { cat:'leisure', time:'09:00', title:'오전 자유 일정', place:'황리단길' },
      { cat:'hotel', time:'15:00', title:'숙소 체크인', place:'라한셀렉트 경주' },
      { cat:'leisure', time:'17:00', title:'오후 자유 일정', place:'미정', last:true },
    ], trailing: null },
  { items: [
      { cat:'hotel', time:'11:00', title:'숙소 체크아웃', place:'라한셀렉트 경주' },
      { cat:'leisure', time:'13:00', title:'오후 자유 일정', place:'미정' },
      { cat:'train', time:'17:24', title:'경주 출발', place:'KTX 048' },
      { cat:'train', time:'19:34', title:'서울 도착', last:true },
    ], trailing: null },
];

function renderDay(index){
  const day = DAY_TIMELINES[index];
  const itemsHtml = day.items.map(it => timelineItem(it)).join('');
  const trailingHtml = day.trailing ? '<div class="trailing-note">'+day.trailing+'</div>' : '';
  return '<div class="screen timeline">'+itemsHtml+trailingHtml+'</div>';
}

/* amount: null = 아직 미정. 지출/예산은 이제 Supabase의 expenses / budget
   테이블에 저장되고, 여러 기기에서 공유해서 봄 (realtime 구독으로 다른
   기기 변경사항도 자동 반영). id는 Supabase가 자동 생성하는 값. */
const DEFAULT_EXPENSES = [
  { cat:'train',   day:'8/8(토)',        title:'SRT 305 (수서→경주)', amount:127800 },
  { cat:'train',   day:'8/9(일)',        title:'KTX 048 (경주→서울)', amount:147900 },
  { cat:'hotel',   day:'8/8(토)~8/9(일)', title:'라한셀렉트 경주 1박', amount:346700 },
];

let BUDGET = 900000;
let BUDGET_ROW_ID = null;
let EXPENSES = [];

async function loadBudget(){
  const { data, error } = await supabase.from('budget').select('*').limit(1);
  if (!error && data && data.length){
    BUDGET_ROW_ID = data[0].id;
    BUDGET = data[0].amount;
    return;
  }
  const { data: inserted } = await supabase.from('budget').insert({ amount: 900000 }).select();
  if (inserted && inserted[0]){ BUDGET_ROW_ID = inserted[0].id; BUDGET = inserted[0].amount; }
}
async function saveBudget(){
  if (BUDGET_ROW_ID == null) return;
  await supabase.from('budget').update({ amount: BUDGET }).eq('id', BUDGET_ROW_ID);
}

async function loadExpenses(){
  const { data, error } = await supabase.from('expenses').select('*').order('created_at', { ascending: true });
  if (!error && data && data.length){ EXPENSES = data; return; }
  const { data: inserted } = await supabase.from('expenses').insert(DEFAULT_EXPENSES).select();
  EXPENSES = inserted || [];
}
async function deleteExpense(id){
  await supabase.from('expenses').delete().eq('id', id);
  await loadExpenses();
  renderContent();
}

function formatWon(n){ return n.toLocaleString('ko-KR')+'원'; }

function expenseRow(e){
  const c = CAT[e.cat];
  return (
    '<div class="exp-row" data-id="'+e.id+'">'
      + '<div class="exp-row-main">'
        + '<div class="exp-cat-icon" style="background:'+catTint(e.cat)+';color:'+catColor(e.cat)+'">'+icon(c.icon,16)+'</div>'
        + '<div class="exp-name">'+e.title+'</div>'
      + '</div>'
      + '<div class="exp-amount'+(e.amount==null ? ' pending' : '')+'">'+(e.amount==null ? '미정' : formatWon(e.amount))+'</div>'
    + '</div>'
  );
}

function renderExpense(){
  const expenses = EXPENSES;
  const known = expenses.filter(e => e.amount != null);
  const pendingCount = expenses.length - known.length;
  const total = known.reduce((s,e) => s + e.amount, 0);
  const balance = BUDGET - total;
  const rowsHtml = expenses.map(e => expenseRow(e)).join('<div class="divider"></div>');
  return (
    '<div class="screen">'
    + '<div class="section">'
      + sectionLabel('total', '잔액'+(pendingCount > 0 ? ' (미정 '+pendingCount+'건 제외)' : ''))
      + '<div class="card">'
        + '<div class="exp-amount" id="balanceAmount" style="text-align:right; display:block; font-size:22px; cursor:pointer">'+ formatWon(balance) +'</div>'
      + '</div>'
    + '</div>'
    + '<div class="section">'
      + '<div class="section-label" style="justify-content:space-between">'
        + '<div style="display:flex;align-items:center;gap:10px">'
          + '<div class="badge" style="background:'+catTint('total')+';color:'+catColor('total')+'">'+icon(CAT.total.icon,18)+'</div>'
          + '<div class="text">지출 내역</div>'
        + '</div>'
        + '<button type="button" class="add-btn" id="addExpenseBtn" aria-label="지출 추가">'+icon('plus',16)+'</button>'
      + '</div>'
      + '<div class="card"><div class="stack">'+rowsHtml+'</div></div>'
    + '</div>'
    + '</div>'
  );
}

const EXPENSE_CATS = [
  { key:'train',   label:'기차' },
  { key:'hotel',   label:'숙소' },
  { key:'food',    label:'음식' },
  { key:'ticket',  label:'티켓' },
  { key:'leisure', label:'기타' },
];
let selectedAddCat = 'food';

function renderCatPicker(){
  const el = document.getElementById('catPicker');
  el.innerHTML = EXPENSE_CATS.map(c =>
    '<button type="button" class="cat-btn'+(c.key === selectedAddCat ? ' active' : '')+'" data-cat="'+c.key+'" '
      + 'style="background:'+catTint(c.key)+';color:'+catColor(c.key)+'" aria-label="'+c.label+'">'+icon(CAT[c.key].icon,18)+'</button>'
  ).join('');
  el.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => { selectedAddCat = btn.dataset.cat; renderCatPicker(); });
  });
}

let editingId = null;

function openExpenseModal(id){
  editingId = id || null;
  const item = editingId ? EXPENSES.find(e => e.id === editingId) : null;
  document.getElementById('modalTitle').textContent = item ? '지출 수정' : '지출 추가';
  document.getElementById('expAddBtn').textContent = item ? '저장' : '추가';
  document.getElementById('expDeleteBtn').style.display = item ? '' : 'none';
  document.getElementById('expTitleInput').value = item ? item.title : '';
  document.getElementById('expAmountInput').value = item && item.amount != null ? item.amount.toLocaleString('ko-KR') : '';
  selectedAddCat = item ? item.cat : 'food';
  renderCatPicker();
  document.getElementById('expenseModalBackdrop').classList.add('open');
  document.getElementById('expTitleInput').focus();
}
function closeExpenseModal(){
  document.getElementById('expenseModalBackdrop').classList.remove('open');
  editingId = null;
}
async function submitExpense(){
  const title = document.getElementById('expTitleInput').value.trim();
  const amountRaw = document.getElementById('expAmountInput').value.replace(/,/g, '');
  const amount = Number(amountRaw);
  if (!title || !amountRaw || !(amount > 0)) return;
  if (editingId){
    await supabase.from('expenses').update({ cat: selectedAddCat, title: title, amount: amount }).eq('id', editingId);
  } else {
    await supabase.from('expenses').insert({ cat: selectedAddCat, day: '', title: title, amount: amount });
  }
  await loadExpenses();
  closeExpenseModal();
  renderContent();
}

function liveFormatAmount(e){
  const digits = e.target.value.replace(/[^0-9]/g, '');
  e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
}
document.getElementById('expAmountInput').addEventListener('input', liveFormatAmount);
document.getElementById('expCancelBtn').addEventListener('click', closeExpenseModal);
document.getElementById('expAddBtn').addEventListener('click', submitExpense);
document.getElementById('expDeleteBtn').addEventListener('click', () => {
  if (editingId) deleteExpense(editingId);
  closeExpenseModal();
});
document.getElementById('expenseModalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'expenseModalBackdrop') closeExpenseModal();
});
document.getElementById('content').addEventListener('click', (e) => {
  if (e.target.closest('#addExpenseBtn')) { openExpenseModal(); return; }
  if (e.target.closest('#balanceAmount')) { openBudgetModal(); return; }
  const row = e.target.closest('.exp-row[data-id]');
  if (row) openExpenseModal(row.dataset.id);
});

function openBudgetModal(){
  document.getElementById('currentBudgetLabel').textContent = '현재 예산: '+formatWon(BUDGET);
  document.getElementById('budgetInput').value = BUDGET.toLocaleString('ko-KR');
  document.getElementById('budgetModalBackdrop').classList.add('open');
  document.getElementById('budgetInput').focus();
}
function closeBudgetModal(){
  document.getElementById('budgetModalBackdrop').classList.remove('open');
}
async function submitBudget(){
  const raw = document.getElementById('budgetInput').value.replace(/,/g, '');
  const val = Number(raw);
  if (!raw || !(val > 0)) return;
  BUDGET = val;
  await saveBudget();
  closeBudgetModal();
  renderContent();
}
document.getElementById('budgetInput').addEventListener('input', liveFormatAmount);
document.getElementById('budgetCancelBtn').addEventListener('click', closeBudgetModal);
document.getElementById('budgetSaveBtn').addEventListener('click', submitBudget);
document.getElementById('budgetModalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'budgetModalBackdrop') closeBudgetModal();
});

const TABS = [
  { key:'home', label:'홈' },
  { key:'day1', label:'Day 1' },
  { key:'day2', label:'Day 2' },
  { key:'expense', label:'지출' },
];

let activeIndex = 0;

function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = TABS.map((t, i) =>
    '<button class="tab" role="tab" aria-selected="'+(i === activeIndex)+'" data-index="'+i+'">'+t.label+'</button>'
  ).join('');
  bar.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => setActive(Number(el.dataset.index)));
  });
}

function renderContent(){
  const content = document.getElementById('content');
  if (activeIndex === 0) content.innerHTML = renderHome();
  else if (TABS[activeIndex].key === 'expense') content.innerHTML = renderExpense();
  else content.innerHTML = renderDay(activeIndex);
}

function setActive(i){
  if (i === activeIndex) return;
  activeIndex = i;
  renderTabs();
  renderContent();
}

function subscribeRealtime(){
  supabase.channel('expenses-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, async () => {
      await loadExpenses();
      if (TABS[activeIndex].key === 'expense') renderContent();
    })
    .subscribe();
  supabase.channel('budget-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'budget' }, async () => {
      await loadBudget();
      if (TABS[activeIndex].key === 'expense') renderContent();
    })
    .subscribe();
}

(async function init(){
  renderTabs();
  document.getElementById('content').innerHTML = '<div class="screen" style="text-align:center;padding:60px 0;color:var(--fg-tertiary);font-size:14px">불러오는 중...</div>';
  await Promise.all([loadBudget(), loadExpenses()]);
  renderContent();
  subscribeRealtime();
})();
</script>
